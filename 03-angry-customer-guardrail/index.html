<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angry Customer Guardrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #fafafa;
    --text: #111827;
    --muted: #6b7280;
    --faint: #9ca3af;
    --border: #e5e7eb;
    --track: #f3f4f6;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --bot: #15803d;
    --bot-soft: #ecfdf3;
    --watch: #b45309;
    --watch-bar: #f59e0b;
    --watch-soft: #fffbeb;
    --human: #b91c1c;
    --human-bar: #dc2626;
    --human-soft: #fef2f2;
    --ok-bar: #22c55e;
    --radius: 10px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 20px/1.5 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1760px; margin: 0 auto; padding: 32px 56px 48px; }

  header { margin-bottom: 24px; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }

  .layout { display: grid; grid-template-columns: 330px minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start; }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 0 0 16px; }

  /* Chat */
  .chat { border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; height: min(800px, calc(100vh - 180px)); min-height: 420px; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 82%; display: flex; flex-direction: column; gap: 6px; }
  .msg .bubble { padding: 12px 18px; border-radius: 20px; white-space: pre-wrap; word-break: break-word; }
  .msg.customer { align-self: flex-end; align-items: flex-end; }
  .msg.customer .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; }
  .msg.bot .bubble { background: var(--track); border-bottom-left-radius: 4px; }
  .msg .who { font-size: 16px; color: var(--faint); }
  .handoff {
    align-self: stretch; text-align: center; font-size: 18px; color: var(--human); background: var(--human-soft);
    border-radius: var(--radius); padding: 14px 18px;
  }
  .handoff b { font-weight: 600; }
  .composer { border-top: 1px solid var(--border); padding: 14px; display: flex; gap: 12px; }
  .composer input {
    flex: 1; min-width: 0; font: inherit; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; outline: none;
  }
  .composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer input:disabled { background: var(--surface); }
  .run {
    font: 600 18px/1 Inter, system-ui, sans-serif; color: #fff; background: var(--text);
    border: 0; border-radius: 10px; padding: 0 26px; cursor: pointer;
  }
  .run:hover { background: #000; }
  .run:disabled { opacity: 0.5; cursor: default; }
  .ghost { font: 500 17px/1 Inter, system-ui, sans-serif; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
  .ghost:hover { color: var(--text); }

  .canned-head { display: flex; justify-content: space-between; align-items: baseline; }
  .canned-head h2 { margin-left: 14px; }
  .chips { display: grid; gap: 2px; }
  .chips button {
    font: inherit; font-size: 17px; line-height: 1.35; color: var(--text); background: none; text-align: left;
    border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  }
  .chips button:hover { background: var(--surface); }
  .chips button:disabled { opacity: 0.5; cursor: default; }

  /* Route pills */
  .pill { display: inline-flex; align-items: center; gap: 6px; font: 600 16px/1 Inter, system-ui, sans-serif; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .pill.bot { color: var(--bot); background: var(--bot-soft); }
  .pill.watch { color: var(--watch); background: var(--watch-soft); }
  .pill.human { color: var(--human); background: var(--human-soft); }
  .pill.pending { color: var(--muted); background: var(--track); }
  .pill .ms { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500; opacity: .8; }

  /* Guardrail column */
  .live { border: 1px solid var(--border); border-radius: 14px; padding: 22px 26px; margin-bottom: 36px; }
  .live-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; min-height: 32px; }
  .live-head .title { font-weight: 600; }
  .live .hint { color: var(--faint); font-size: 18px; }

  .signals { display: grid; gap: 14px; }
  .signal { display: grid; grid-template-columns: 185px 1fr 96px; align-items: center; gap: 14px; }
  .signal .name { font-size: 18px; }
  .signal .track { height: 14px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .signal .fill { height: 100%; width: 0; background: var(--ok-bar); border-radius: 999px; transition: width 400ms cubic-bezier(.2,.8,.2,1), background 200ms; }
  .signal .fill.watch { background: var(--watch-bar); }
  .signal .fill.human { background: var(--human-bar); }
  .signal .val { font: 500 17px/1 "JetBrains Mono", ui-monospace, monospace; text-align: right; font-variant-numeric: tabular-nums; }
  .level { font-size: 17px; color: var(--muted); margin-top: 2px; }
  .direct { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .direct .name { font-weight: 600; }
  .direct .track { height: 18px; }

  .log { display: grid; }
  .log .empty { color: var(--faint); margin: 0; }
  .entry { border-top: 1px solid var(--border); padding: 24px 0; }
  .entry:first-child { border-top: 0; padding-top: 0; }
  .entry-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  .entry-title { font-weight: 600; }
  .quote { color: var(--muted); font-size: 18px; margin: 0 0 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reasons { font-size: 17px; color: var(--muted); margin: 12px 0 0; }

  details { margin-top: 14px; }
  details + details { margin-top: 8px; }
  summary { font-size: 17px; color: var(--muted); cursor: pointer; }
  pre {
    font: 16px/1.6 "JetBrains Mono", ui-monospace, monospace; background: var(--surface); white-space: pre-wrap; word-break: break-word;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 10px 0 0;
  }
  .error { color: var(--human); }

  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .wrap { padding: 32px 16px 48px; }
    .layout { grid-template-columns: 1fr; gap: 40px; }
    .chat { height: 460px; }
    .canned { order: 2; }
    .signal { grid-template-columns: 110px 1fr 76px; gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Angry customer guardrail</h1>
  </header>

  <div class="layout">
    <nav class="canned">
      <div class="canned-head">
        <h2>Try a message</h2>
        <button class="ghost" id="reset">Start over</button>
      </div>
      <div class="chips" id="chips"></div>
    </nav>

    <main>
      <h2>Support chat</h2>
      <div class="chat">
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer" autocomplete="off">
          <input id="input" placeholder="Type a message…" aria-label="Message">
          <button class="run" id="send">Send</button>
        </form>
      </div>
    </main>

    <aside>
      <h2>Live check</h2>
      <div class="live" id="live">
        <div class="live-head"><span class="title">As you type</span><span id="livePill"></span></div>
        <div id="liveBody"><p class="hint">Start typing to see Jev score the message in real time.</p></div>
      </div>

      <h2>Guardrail log</h2>
      <div class="log" id="log"><p class="empty">Each message you send is checked by Jev before the bot replies.</p></div>
    </aside>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
